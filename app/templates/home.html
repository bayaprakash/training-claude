{% extends "base.html" %}
{% block title %}InfraWatch{% endblock %}
{% block content %}
<section class="hero">
  <p class="eyebrow">Infrastructure monitoring</p>
  <h1 class="brand-hero">InfraWatch</h1>
  <p class="lede">
    Signed in as <strong class="mono">{{ session.get('username') }}</strong>.
    Add Linux servers, then open the dashboard for CPU, memory, network, and ports.
  </p>
  <div class="actions" style="margin-top: 1.25rem;">
    <a class="btn primary" href="{{ url_for('dashboard.index') }}">Open dashboard</a>
    <a class="btn" href="{{ url_for('servers.manage_servers') }}">Manage servers</a>
  </div>
</section>
{% endblock %}
